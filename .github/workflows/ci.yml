name: quantelis-ci
on:
  push:
  pull_request:
jobs:
  gcc-clang:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CC: ${{ matrix.compiler }}
        run: cmake -S . -B build -DQUANTELIS_BUILD_TESTS=ON -DQUANTELIS_STRICT_WARNINGS=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}
  gcc-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan and UBSan
        run: cmake -S . -B build-sanitize -DQUANTELIS_BUILD_TESTS=ON -DQUANTELIS_STRICT_WARNINGS=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build-sanitize --parallel
      - run: ctest --test-dir build-sanitize --output-on-failure
  msvc:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DQUANTELIS_BUILD_TESTS=ON -DQUANTELIS_STRICT_WARNINGS=ON -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - run: cmake --build build --config ${{ matrix.build_type }} --parallel
      - run: ctest --test-dir build --output-on-failure -C ${{ matrix.build_type }}
